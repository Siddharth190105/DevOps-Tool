apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
          - echo "<html><body style='background-color:blue; color:white; text-align:center;'><h1>BLUE DEPLOYMENT</h1></body></html>" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
